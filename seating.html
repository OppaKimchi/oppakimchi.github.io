<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reception Seating | Vitou & Carmen</title>
    <meta name="theme-color" content="#7a2230">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="hero hero-maroon">
        <p class="eyebrow">Reception Seating</p>
        <h1>Taste of Shunde Banquet</h1>
        <p class="date">Find Your Seat</p>
        <p class="subtitle">Search by first or last name to see your table.</p>
    </header>
    
    <nav class="top-nav">
        <a href="index.html">Order of Service</a>
        <a href="seating.html">Reception Seating</a>
        <a href="banquet-menu.html">Banquet Menu</a>
    </nav>

    <main class="container">
        <section class="panel guest-search-panel">
            <div class="section-heading">
                <h2>Guest Search</h2>
                <p>Type your first or last name below to find your table.</p>
            </div>

            <label class="search-label" for="searchInput">Search guest name</label>
            <input type="text" id="searchInput" placeholder="Enter your name...">
            <p class="search-hint">Use at least two letters for the best result.</p>

            <div id="results" class="results-shell"></div>
        </section>
    </main>

    <script>
        const seatingData = [
            { table: "Table 1", guests: ["Carol Chiu", "Jaffe Chiu", "Melody Robertson", "Edward Robertson", "Ian Robertson", "James Zhang", "Angie Zhang","Ian Wu", "Winnie Wu", "Howard Law"] },
            { table: "Table 2", guests: ["Victor Lai", "Fiona Lam", "Vincent Chen", "Lina Chen", "Stephanie Wu", "Lily Xiao", "Marcus Li", "Sarah Chen", "Tom Pirie", "Naomi Huang"] },
            { table: "Table 3", guests: ["Vickie Su", "Wilson Leung", "Carl Tong", "Celeste Leong", "Linh Dam", "Tracy Li", "Nancy Li", "Glorya Lam", "Alan Lam", "Kenny Zhou"] },
            { table: "Table 4", guests: ["Chau Au", "Antanitta Rajah", "Nicholas Lee", "Keanu Tsang", "Wilbur Tsang", "Andrea Su", "Terence Li", "Andy Hardy", "Madeline Tjahjadi", "Kevin Lee"] },
            { table: "Table 5", guests: ["Sophia Aspera", "Isaac Lau", "Tracey Nguyen", "James Wealth", "Ali Fardos", "Kate Aizparu", "Hayley Espanol", "Trent Bell", "Sameen Khan", "Michael O'Reilly", "Kathleem Dumlao"] },
            { table: "Table 6", guests: ["Alice Chau", "Grandma", "Anson Nguyen", "Calista Chiu", "Aaron Nguyen","Kenneth Fung", "Chor Ling Ho", "Kan Kee Fung", "Jenny Voller", "Geoff Voller"] },
            { table: "Table 7", guests: ["Vichet Seng", "Malen Eang", "Oscar Chet", "Veronika Chet", "Angelina Chet", "Botum Bun", "Erick Seng", "Pholy Chin", "Thidapith Tith", "Jim McDonald", "Sofie McDonald"] },
            { table: "Table 8", guests: ["Vouch Ngim Srun", "Neang Seng", "Savorn In", "Vouchluy Srun", "Carmen Nguyen", "Vitou Seng", "Yameng Lai", "Phoebe Tao", "Alex Dam", "Tenzin Shakya"] },
            { table: "Table 9", guests: ["Peter Chen", "Thomas Chin", "Carol Chin", "Estella Green", "Grace Chen", "Ben Pantlin", "Cate Hong", "Jason He", "Kinzey Rahardja", "Stella Li"] }
        ];

        function searchGuest() {
            const input = document.getElementById('searchInput').value.toLowerCase().trim();
            const resultsDiv = document.getElementById('results');

            if (input.length < 2) {
                resultsDiv.innerHTML = '<p class="empty-state">Start typing to reveal your table assignment.</p>';
                return;
            }

            let htmlString = '';

            seatingData.forEach(tableGroup => {
                const matchedGuests = tableGroup.guests.filter(guest => guest.toLowerCase().includes(input));

                if (matchedGuests.length > 0) {
                    htmlString += `
                        <div class="table-result">
                            <h3>${tableGroup.table}</h3>
                            <p><strong>Guests at this table:</strong> ${tableGroup.guests.join(', ')}</p>
                        </div>
                    `;
                }
            });

            if (htmlString === '') {
                resultsDiv.innerHTML = '<p class="empty-state">No guest found. Please try searching a different name.</p>';
            } else {
                resultsDiv.innerHTML = htmlString;
            }
        }

        const searchInput = document.getElementById('searchInput');
        const resultsDiv = document.getElementById('results');

        resultsDiv.innerHTML = '<p class="empty-state">Start typing to reveal your table assignment.</p>';
        searchInput.addEventListener('input', searchGuest);
        searchInput.addEventListener('focus', () => {
            if (!resultsDiv.innerHTML) {
                resultsDiv.innerHTML = '<p class="empty-state">Start typing to reveal your table assignment.</p>';
            }
        });
    </script>
</body>
</html>
